name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:assistant
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Assemble TV-ready web project
        run: |
          mkdir -p tv-package
          cp -R dist/. tv-package/
          cp docs/TV-SETUP.md tv-package/INSTALL.md
          cat > tv-package/SETUP-TRANSFER.txt <<'EOF'
          Configure B1O TV in the PC browser, then use Settings > Export TV Setup.
          On the TV, open the same B1O TV build and choose Settings > Import TV Setup.
          The JSON includes the device token. Keep it private and delete it after import.
          This package contains the web project files, not a signed WGT.
          To install a WGT, open the files in Samsung Tizen Studio and sign with your own TV certificate.
          EOF
      - name: Upload TV-ready project
        uses: actions/upload-artifact@v4
        with:
          name: B1O-TV-TV-Project
          path: tv-package/
          if-no-files-found: error
          retention-days: 30
