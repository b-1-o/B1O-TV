name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the leading v (for example 0.4.0)"
        required: true
        default: "0.4.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 0.4.0; received: $RAW_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Apply release version to the build workspace
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const manifestPath = 'public/config.xml';
          const manifest = fs.readFileSync(manifestPath, 'utf8').replace(/version="[^"]+"/, 'version="' + version + '"');
          fs.writeFileSync(manifestPath, manifest);
          NODE
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:assistant
      - run: npm run lint
      - run: npm test
      - name: Install ImageMagick for TV asset optimization
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick zip
      - run: npm run build
      - name: Assemble the unsigned TV web project
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_DIR="B1O-TV-v${RELEASE_VERSION}"
          ARCHIVE="${PACKAGE_DIR}.zip"
          mkdir -p "$PACKAGE_DIR/docs"
          cp -R dist/. "$PACKAGE_DIR/"
          cp README.md LICENSE CHANGELOG.md "$PACKAGE_DIR/"
          cp docs/INSTALL.md docs/TV-SETUP.md docs/ROADMAP.md "$PACKAGE_DIR/docs/"
          cat > "$PACKAGE_DIR/INSTALL-NOTES.txt" <<'EOF'
          This archive contains the B1O TV web project, not a signed WGT.
          Sign the application with your own Samsung TV certificate in Tizen Studio.
          Never share your certificate, signing password, device token, or exported setup JSON.
          Full English instructions are in docs/INSTALL.md.
          EOF
          zip -qr "$ARCHIVE" "$PACKAGE_DIR"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: B1O TV v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            B1O TV v${{ steps.meta.outputs.version }}.

            The attached archive is the unsigned TV web project. Sign it with your own Samsung TV certificate in Tizen Studio before installation.

            See CHANGELOG.md and the included English installation guide for setup instructions.
          files: ${{ env.ARCHIVE }}
