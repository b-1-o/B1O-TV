name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Tizen scripts and manifest
        run: |
          bash -n scripts/deploy-tizen-tv.sh
          bash -n scripts/tv-doctor.sh
          node --check scripts/optimize-tv-assets.mjs
          node --check scripts/package-tizen-tv.mjs
          python3 -m py_compile scripts/package-tizen-tv.py
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("public/config.xml")'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:assistant
      - run: npm run lint
      - run: npm run test
      - name: Install ImageMagick for TV asset optimization
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - run: npm run package:tizen-web -- --output "release-tizen/B1O-TV-unsigned.wgt"
      - name: Verify Samsung TV launcher icon and unsigned WGT
        run: |
          test -s dist/icon.png
          test -s release-tizen/B1O-TV-unsigned.wgt
      - name: Assemble TV project and AI installation kit
        run: |
          set -euo pipefail
          mkdir -p tv-package/docs
          cp -R dist/. tv-package/
          cp release-tizen/B1O-TV-unsigned.wgt tv-package/
          cp README.md LICENSE CHANGELOG.md PROMPT.md AGENTS.md tv-package/
          cp docs/INSTALL.md docs/AI-INSTALL.md docs/TV-SETUP.md docs/PERFORMANCE.md docs/ROADMAP.md tv-package/docs/
          cat > tv-package/INSTALL-NOTES.txt <<'EOF'
          Open PROMPT.md in an AI coding agent with terminal access and follow docs/AI-INSTALL.md.
          B1O-TV-unsigned.wgt is an unsigned package. Import it into Apps2Samsung or sign locally with your Tizen Studio certificate.
          Do not install the unsigned WGT directly with SDB. Never share certificates, signing passwords, device tokens, API keys, or exported setup JSON.
          TV-side Developer Mode and Samsung account/certificate prompts must be approved by the TV owner.
          EOF
      - name: Upload TV-ready project
        uses: actions/upload-artifact@v4
        with:
          name: B1O-TV-AI-Install-Kit
          path: tv-package/
          if-no-files-found: error
          retention-days: 30
