name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Tizen scripts and manifest
        run: |
          bash -n scripts/deploy-tizen-tv.sh
          node --check scripts/optimize-tv-assets.mjs
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("public/config.xml")'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:assistant
      - run: npm run lint
      - run: npm run test
      - name: Install ImageMagick for TV asset optimization
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - run: npm run build
      - name: Verify Samsung TV launcher icon
        run: test -s dist/icon.png
      - name: Assemble TV-ready web project
        run: |
          mkdir -p tv-package
          cp -R dist/. tv-package/
          cp docs/INSTALL.md tv-package/INSTALL.md
          cp docs/TV-SETUP.md tv-package/TV-SETUP-REFERENCE.md
          cat > tv-package/SETUP-TRANSFER.txt <<'EOF'
          Configure B1O TV in the PC browser, then use Settings > Export TV Setup.
          On the TV, open Settings > Import TV Setup and select the exported JSON file. Do not share the file or commit it to Git.
          The JSON includes the device token. Keep it private and delete it after import.
          This package contains the web project files, not a signed WGT.
          To install a WGT, open the files in Samsung Tizen Studio and sign with your own TV certificate.
          EOF
      - name: Upload TV-ready project
        uses: actions/upload-artifact@v4
        with:
          name: B1O-TV-TV-Project
          path: tv-package/
          if-no-files-found: error
          retention-days: 30
